services:
  postgres:
    image: postgres:16-alpine
    container_name: euroespes_postgres_prod_sim
    environment:
      POSTGRES_DB: euroespes_prod_sim
      POSTGRES_USER: euroespes_app
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "55432:5432"
    volumes:
      - prod_sim_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: euroespes_redis_prod_sim
    command: redis-server --appendonly yes --requirepass local-only-redis-password
    ports:
      - "56379:6379"
    volumes:
      - prod_sim_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-only-redis-password", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  proxy:
    image: nginx:1.27-alpine
    container_name: euroespes_proxy_prod_sim
    depends_on:
      - postgres
      - redis
    ports:
      - "8443:8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prod-sim/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/prod-sim/certs:/etc/nginx/certs:ro
      - prod_sim_uploads:/var/lib/euroespes/uploads:ro

volumes:
  prod_sim_postgres:
  prod_sim_redis:
  prod_sim_uploads:
