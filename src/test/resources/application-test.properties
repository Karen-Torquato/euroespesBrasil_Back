# Banco em memória para testes ? isolado, limpo a cada execução
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# JWT de teste (64+ chars obrigatório para HS256/HS512)
jwt.secret=ChaveDeTeste_MuitoLonga_ParaOsTestesSemPreExigir64CaracteresOuMaisOk!
jwt.expiration.ms=3600000

# CORS teste
app.cors.allowed-origins=http://localhost:4200

# Upload teste
app.upload.dir=uploads-test/
app.upload.max-size-bytes=10485760
app.upload.allowed-extensions=pdf,jpg,jpeg,png

# Admin padrão para testes
app.seed.create-default-admin=true
app.seed.enabled=true
app.admin.username=admin
app.admin.password=Admin@12345

# Security policy for tests
app.security.require-ssl=false
app.security.login.max-attempts=50
app.security.login.window-seconds=60

# Logs mais silenciosos em testes
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

