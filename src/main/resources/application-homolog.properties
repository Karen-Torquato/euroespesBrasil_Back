# Homologation profile for PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/euroespes_homolog}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:euroespes}
spring.datasource.password=${DB_PASSWORD:change-me}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.clean-disabled=true
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
spring.cache.type=none

# Homologation starts with a bootstrap admin for testing
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.create-default-admin=${CREATE_DEFAULT_ADMIN:true}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
app.security.require-ssl=${REQUIRE_SSL:false}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:60}

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EuroespesHomologPool
spring.datasource.hikari.leak-detection-threshold=60000
