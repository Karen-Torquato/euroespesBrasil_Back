# Base configuration shared by all environments.
# Use SPRING_PROFILES_ACTIVE=dev|test|prod to select environment.

spring.profiles.default=dev

# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/rotas-entregas
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate base settings
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Multipart defaults
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# JWT
# In production this must come from secret manager / environment variable.
jwt.secret=${JWT_SECRET:MudeMeParaUmSegredoMuitoLongoESeguroDeNoMinimo64CaracteresObrigatorio!!}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# CORS (comma-separated)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Upload
app.upload.dir=${UPLOAD_DIR:uploads/pacientes/}
app.upload.max-size-bytes=10485760
app.upload.allowed-extensions=pdf,jpg,jpeg,png

# Default admin bootstrap (first startup)
app.seed.create-default-admin=${CREATE_DEFAULT_ADMIN:true}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# Seed data toggle (sample patients)
app.seed.enabled=${APP_SEED_ENABLED:true}

# Security policy toggles
app.security.require-ssl=${REQUIRE_SSL:false}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:8}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:60}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
