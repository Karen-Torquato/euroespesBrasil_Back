# Production profile

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Never expose H2 console in production
spring.h2.console.enabled=false

# Production policies
app.seed.enabled=false
app.seed.create-default-admin=${CREATE_DEFAULT_ADMIN:false}
app.security.require-ssl=true

# In production set only real frontend domains (comma-separated)
# Example: CORS_ORIGINS=https://app.seudominio.com,https://admin.seudominio.com
app.cors.allowed-origins=${CORS_ORIGINS}

# Safer defaults for login throttling in production
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:60}

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=EuroespesPool
spring.datasource.hikari.leak-detection-threshold=60000

