# Production profile

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Never expose H2 console in production
spring.h2.console.enabled=false

# Production policies
app.seed.enabled=false
app.seed.create-default-admin=${CREATE_DEFAULT_ADMIN:false}
app.security.require-ssl=true

# In production set only real frontend domains (comma-separated)
# Example: CORS_ORIGINS=https://app.seudominio.com,https://admin.seudominio.com
app.cors.allowed-origins=${CORS_ORIGINS}

# Safer defaults for login throttling in production
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window-seconds=${LOGIN_WINDOW_SECONDS:60}

