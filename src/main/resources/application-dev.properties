# Development profile

spring.datasource.url=jdbc:h2:file:./data/rotas-entregas
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console only in dev
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev policies
app.seed.enabled=true
app.seed.create-default-admin=true
app.security.require-ssl=false

# Redis desabilitado em dev (sem instância local por padrão)
spring.cache.type=none

