version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: euroespes_postgres_homolog
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-euroespes_homolog}
      POSTGRES_USER: ${POSTGRES_USER:-euroespes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
